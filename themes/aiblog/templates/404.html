{% extends "base.html" %}

{% block title %}Page Not Found &mdash; {{ SITENAME }}{% endblock %}

{% block content %}
<section class="py-20 lg:py-32">
    <div class="max-w-lg mx-auto px-4 text-center">
        <div class="text-8xl font-extrabold tracking-tight bg-gradient-to-r from-brand-600 via-brand-500 to-accent-500 bg-clip-text text-transparent mb-6">404</div>
        <h1 class="text-2xl font-bold text-surface-900 dark:text-white mb-3">Page not found</h1>
        <p class="text-surface-500 dark:text-surface-400 mb-8">The page you're looking for doesn't exist or has been moved.</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
                Back to Home
            </a>
            <a href="/archives/index.html" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-surface-700 dark:text-surface-300 border border-surface-200 dark:border-surface-700 rounded-lg hover:bg-surface-50 dark:hover:bg-surface-900 transition-colors">
                Browse Archives
            </a>
        </div>
    </div>
</section>
{% endblock %}
